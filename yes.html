<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Наш морской гид</title>
    <style>
        /* ... все стили как в предыдущей версии ... */
        /* (оставляем без изменений, они уже были) */
    </style>
</head>
<body>
<div class="container">
    <h1>🧜‍♀️ Карта наших приключений 🐚</h1>
    <div class="sub">переставляй, убирай, редактируй — собери идеальный день ✨</div>

    <div id="categoriesContainer">
        <div class="loading">⏳ Загрузка...</div>
    </div>

    <div class="actions">
        <button id="toggleEditBtn" class="action-btn orange">✏️ Режим редактирования</button>
        <button id="saveToGitBtn" class="action-btn green">💾 Сохранить в GitHub</button>
        <button id="resetLocalBtn" class="action-btn orange">🌊 Вернуть всё как было</button>
        <button id="addCategoryBtn" class="action-btn">➕ Добавить категорию</button>
        <a href="index.html" class="action-btn" style="text-decoration:none;background:#5887a3;">🔙 К началу</a>
    </div>
    <footer>💙 изменения сохраняются через GitHub Actions</footer>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    // ---------- ИСХОДНЫЕ ДАННЫЕ ----------
    const categoriesData = {
        "🌊 У воды": [
            { name: "Утиный мост", desc: "Романтичный и ностальгический вид на реку", addr: "" },
            { name: "Порто Мальтезе", desc: "Средиземноморская кухня, панорама на воду", addr: "Невский 174" },
            { name: "Ресторан «Ассамблея»", desc: "Панорамные виды, авторская кухня", addr: "" },
            { name: "Кофейный ларёчек", desc: "Просто взять кофе", addr: "" }
        ],
        "🌿 Парки для прогулок": [
            { name: "Охта-Оккервиль", desc: "Экотропа, уютно, мало людей", addr: "" },
            { name: "Парк Сказок (Бабушкина)", desc: "Большой парк с аттракционами", addr: "" },
            { name: "Парк строителей", desc: "Просторный и спокойный", addr: "" }
        ],
        "🍿 Кино и развлечения": [
            { name: "КАРО 11 Охта", desc: "ТРЦ Охта Молл, рядом фуд-корт", addr: "" },
            { name: "Кинотеатр «Заневский»", desc: "Новинки и старые плёнки", addr: "" },
            { name: "Смайл Парк", desc: "Аттракционы, музеи, веселье", addr: "" }
        ],
        "🍽️ Кафешки": [
            { name: "Cherdak Khudozhnika", desc: "Кафе-галерея, вид на крыши, фондю", addr: "" },
            { name: "Швабский домик", desc: "Немецкая кухня, своя пивоварня", addr: "" },
            { name: "Бешамель", desc: "Ар-деко, торжественно", addr: "" },
            { name: "Caffe Italia", desc: "Итальянская кухня, живая музыка", addr: "" }
        ],
        "🎨 Необычные идеи": [
            { name: "Cherdak Khudozhnika", desc: "Галерея + ужин на крыше", addr: "" },
            { name: "Смайл Парк", desc: "Музей иллюзий и аттракционы", addr: "" }
        ]
    };

    // ---------- НАСТРОЙКИ ----------
    const REPO_OWNER = 'owner02';
    const REPO_NAME = 'WeekEnd';
    const ISSUE_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`;

    // ---------- СОСТОЯНИЕ ----------
    let currentData = {};
    let editMode = false;
    let isSaving = false;

    // ---------- РАБОТА С GITHUB ----------
    async function loadFromGitHub() {
        try {
            const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/data/places.json?t=${Date.now()}`;
            const response = await fetch(rawUrl);
            if (!response.ok) throw new Error('Не удалось загрузить данные');
            return await response.json();
        } catch (error) {
            console.warn('Загружаем локальные данные:', error);
            return JSON.parse(JSON.stringify(categoriesData));
        }
    }

    async function saveToGitHubViaIssue(data) {
        if (isSaving) return false;
        isSaving = true;
        try {
            // Формируем тело Issue
            const jsonString = JSON.stringify(data, null, 2);
            const issueBody = `📋 Данные для обновления places.json:\n\n\`\`\`json\n${jsonString}\n\`\`\``;

            const response = await fetch(ISSUE_URL, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: '📝 Обновление данных мест',
                    body: issueBody,
                    labels: ['update-data']
                })
            });

            if (response.ok) {
                showToast('✅ Данные отправлены на обновление! Ожидайте до 1 минуты.', 'success');
                return true;
            } else {
                const errorData = await response.json();
                console.error('❌ Ошибка создания Issue:', errorData);
                showToast('❌ Ошибка: ' + (errorData.message || 'Неизвестная ошибка'), 'error');
                return false;
            }
        } catch (error) {
            console.error('❌ Ошибка:', error);
            showToast('❌ Ошибка сети. Проверь интернет-соединение.', 'error');
            return false;
        } finally {
            isSaving = false;
        }
    }

    // ---------- РАБОТА С ДАННЫМИ ----------
    function persistData() {
        localStorage.setItem('seaVibesPlaces', JSON.stringify(currentData));
        renderCategories();
    }

    function moveItem(arr, from, to) {
        if (to < 0 || to >= arr.length) return;
        const item = arr.splice(from, 1)[0];
        arr.splice(to, 0, item);
    }

    function deleteCategory(categoryKey) {
        if (!confirm(`Удалить категорию "${categoryKey}" и все места в ней?`)) return;
        delete currentData[categoryKey];
        persistData();
    }

    function deleteItem(categoryKey, idx) {
        if (!confirm(`Удалить "${currentData[categoryKey][idx].name}"?`)) return;
        currentData[categoryKey].splice(idx, 1);
        if (currentData[categoryKey].length === 0) {
            deleteCategory(categoryKey);
        }
        persistData();
    }

    function moveUp(categoryKey, idx) {
        if (idx <= 0) return;
        const arr = currentData[categoryKey];
        moveItem(arr, idx, idx-1);
        persistData();
    }

    function moveDown(categoryKey, idx) {
        const arr = currentData[categoryKey];
        if (idx >= arr.length-1) return;
        moveItem(arr, idx, idx+1);
        persistData();
    }

    function addItem(categoryKey) {
        const newItem = { name: "Новое место", desc: "Описание", addr: "" };
        currentData[categoryKey].push(newItem);
        persistData();
    }

    function addCategory() {
        const name = prompt('Введите название новой категории (с эмодзи, например "🏖️ Пляжи"):');
        if (!name || name.trim() === '') return;
        if (currentData[name.trim()]) {
            alert('Такая категория уже существует!');
            return;
        }
        currentData[name.trim()] = [];
        persistData();
    }

    function resetToOriginal() {
        if (!confirm('Вернуть всё к исходному состоянию? Все изменения будут потеряны.')) return;
        currentData = JSON.parse(JSON.stringify(categoriesData));
        persistData();
        showToast('🌊 Данные сброшены до исходных', 'success');
    }

    // ---------- РЕДАКТИРОВАНИЕ ----------
    function updateItem(categoryKey, idx, field, value) {
        currentData[categoryKey][idx][field] = value;
        renderCategories();
    }

    function updateCategoryName(oldKey, newKey) {
        if (!newKey || newKey.trim() === '' || oldKey === newKey.trim()) return;
        if (currentData[newKey.trim()]) {
            alert('Категория с таким именем уже существует!');
            return;
        }
        currentData[newKey.trim()] = currentData[oldKey];
        delete currentData[oldKey];
        persistData();
    }

    // ---------- ОТРИСОВКА ----------
    function renderCategories() {
        const container = document.getElementById('categoriesContainer');
        if (!container) return;
        container.innerHTML = '';
        const sortedKeys = Object.keys(currentData).sort();

        for (const catTitle of sortedKeys) {
            const items = currentData[catTitle] || [];
            const catDiv = document.createElement('div');
            catDiv.className = 'category';
            if (editMode) catDiv.classList.add('edit-mode-on');

            const h2 = document.createElement('h2');
            if (editMode) {
                h2.innerHTML = `
                    <input type="text" class="edit-input" value="${escapeHtml(catTitle)}"
                           style="max-width:400px;font-size:1.8rem;font-weight:bold;color:#22668d;border-left:8px solid #ffb882;padding-left:20px;background:transparent;"
                           data-category="${escapeHtml(catTitle)}"
                           onchange="window.updateCategoryNameFromInput('${escapeHtml(catTitle)}', this.value)">
                    <button class="ctrl-btn delete" onclick="window.deleteCategory('${escapeHtml(catTitle)}')" style="font-size:1.2rem;">🗑️</button>
                `;
            } else {
                h2.innerHTML = catTitle;
            }
            catDiv.appendChild(h2);

            const listDiv = document.createElement('div');
            listDiv.className = 'cards-list';

            if (items.length === 0 && !editMode) {
                listDiv.innerHTML = `<div style="padding:20px;text-align:center;color:#7f9eb5;">✨ здесь пока пусто ✨</div>`;
            }

            items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card-item';
                if (editMode) card.classList.add('edit-mode-on');

                let contentHtml = '';
                if (editMode) {
                    contentHtml = `
                        <div class="card-content">
                            <input type="text" class="edit-input" value="${escapeHtml(item.name)}"
                                   style="font-weight:bold;font-size:1.2rem;color:#2e5f7a;"
                                   onchange="window.updateItemField('${escapeHtml(catTitle)}', ${idx}, 'name', this.value)">
                            <textarea class="edit-textarea" rows="2"
                                      onchange="window.updateItemField('${escapeHtml(catTitle)}', ${idx}, 'desc', this.value)">${escapeHtml(item.desc)}</textarea>
                            <input type="text" class="edit-input" value="${escapeHtml(item.addr || '')}"
                                   placeholder="Адрес (необязательно)"
                                   style="font-size:0.85rem;color:#b27d51;font-family:monospace;"
                                   onchange="window.updateItemField('${escapeHtml(catTitle)}', ${idx}, 'addr', this.value)">
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn up" onclick="window.moveUp('${escapeHtml(catTitle)}', ${idx})">⬆️</button>
                            <button class="ctrl-btn down" onclick="window.moveDown('${escapeHtml(catTitle)}', ${idx})">⬇️</button>
                            <button class="ctrl-btn delete" onclick="window.deleteItem('${escapeHtml(catTitle)}', ${idx})">🗑️</button>
                        </div>
                    `;
                } else {
                    contentHtml = `
                        <div class="card-content">
                            <strong>${escapeHtml(item.name)}</strong>
                            <p>${escapeHtml(item.desc)}</p>
                            ${item.addr ? `<div class="address">📍 ${escapeHtml(item.addr)}</div>` : ''}
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn up" onclick="window.moveUp('${escapeHtml(catTitle)}', ${idx})">⬆️</button>
                            <button class="ctrl-btn down" onclick="window.moveDown('${escapeHtml(catTitle)}', ${idx})">⬇️</button>
                            <button class="ctrl-btn delete" onclick="window.deleteItem('${escapeHtml(catTitle)}', ${idx})">🗑️</button>
                        </div>
                    `;
                }
                card.innerHTML = contentHtml;
                listDiv.appendChild(card);
            });

            if (editMode) {
                const addBtn = document.createElement('button');
                addBtn.className = 'action-btn green';
                addBtn.style.marginTop = '12px';
                addBtn.style.fontSize = '0.9rem';
                addBtn.textContent = '+ Добавить место';
                addBtn.onclick = () => window.addItem(catTitle);
                listDiv.appendChild(addBtn);
            }

            catDiv.appendChild(listDiv);
            container.appendChild(catDiv);
        }
    }

    // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    function showToast(text, type = '') {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.className = 'toast show ' + type;
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.className = 'toast';
        }, 5000);
    }

    // ---------- ГЛОБАЛЬНЫЕ ФУНКЦИИ ДЛЯ HTML ----------
    window.moveUp = moveUp;
    window.moveDown = moveDown;
    window.deleteItem = deleteItem;
    window.deleteCategory = deleteCategory;
    window.addItem = addItem;
    window.addCategory = addCategory;
    window.resetToOriginal = resetToOriginal;

    window.updateItemField = function(cat, idx, field, value) {
        if (currentData[cat] && currentData[cat][idx]) {
            currentData[cat][idx][field] = value;
        }
    };

    window.updateCategoryNameFromInput = function(oldKey, newKey) {
        setTimeout(() => {
            if (oldKey !== newKey && newKey.trim() !== '') {
                updateCategoryName(oldKey, newKey.trim());
            }
        }, 300);
    };

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    currentData = await loadFromGitHub();
    renderCategories();

    // ---------- ОБРАБОТЧИКИ КНОПОК ----------
    document.getElementById('toggleEditBtn').addEventListener('click', () => {
        editMode = !editMode;
        document.getElementById('toggleEditBtn').textContent = editMode ? '🔒 Выключить редактирование' : '✏️ Режим редактирования';
        renderCategories();
        showToast(editMode ? '✏️ Режим редактирования включён' : '🔒 Режим редактирования выключен', '');
    });

    document.getElementById('saveToGitBtn').addEventListener('click', async () => {
        if (isSaving) return;
        showToast('⏳ Отправка данных в GitHub...', '');
        await saveToGitHubViaIssue(currentData);
    });

    document.getElementById('resetLocalBtn').addEventListener('click', resetToOriginal);
    document.getElementById('addCategoryBtn').addEventListener('click', addCategory);

    // Обновление данных при возврате на страницу
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            loadFromGitHub().then(data => {
                currentData = data;
                renderCategories();
            });
        }
    });
</script>
</body>
</html>
