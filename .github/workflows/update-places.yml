name: Update places.json from Issue

on:
  issues:
    types: [opened, edited]

jobs:
  update-data:
    runs-on: ubuntu-latest
    if: github.event.issue.title == '📝 Обновление данных мест' || github.event.issue.title == '📝 Update places data'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extract JSON from issue body
        id: extract
        run: |
          BODY="${{ github.event.issue.body }}"
          echo "$BODY" > /tmp/body.txt
          # Извлекаем JSON между маркерами
          sed -n '/```json/,/```/p' /tmp/body.txt | sed '1d;$d' > /tmp/data.json
          echo "JSON extracted"

      - name: Validate JSON
        run: |
          cat /tmp/data.json | jq . > /dev/null || exit 1
          echo "✅ JSON is valid"

      - name: Update places.json
        run: |
          cp /tmp/data.json data/places.json
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/places.json
          git diff --staged --quiet || git commit -m "🔄 Автоматическое обновление данных из Issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER \
            -d '{"state":"closed"}'
